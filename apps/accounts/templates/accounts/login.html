{% extends "base-public.html" %}

{% block title %}
Sign up
{% endblock %}

{% block content %}
<div class="w-full h-full flex items-center justify-center flex-col">
    <form class="card-primary flex w-full max-w-md flex-col gap-4" method="post" action="">
        <div class="flex w-full justify-center items-center flex-col">
            <h1 class="text-2xl text-txt-primary font-bold ">Login</h1>
            <p class="text-lg text-txt-secondary">Notes. Generate. Review.</p>
        </div>
        <div>
            <label class="text-txt-primary" for="id_username">Username or Email</label>
            <input name="username" class="input-primary" placeholder="TonyStark_3000" id="id_username" type="text" required>
        </div>
        <div>
            <label class="text-txt-primary" for="id_email">Email</label>
            <input name="email" class="input-primary" placeholder="email@example.com" id="id_email" type="email" required>
        </div>
        <div>
            <label class="text-txt-primary" for="id_password">Password</label>
            <input name="password" class="input-primary" minlength="8" placeholder="********" id="id_password" type="password" required>
        </div>
        <button class="btn-primary" type="submit">Login</button>
    </form>
</div>

{# The forgot password is yet to be added #}

{% endblock %}
