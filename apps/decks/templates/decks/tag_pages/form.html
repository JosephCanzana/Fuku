{% extends "base-app.html" %}

{% block title %}Tag form{% endblock %}

{% block content %}
<div class="flex w-full justify-center">
    <form method="post" class="card-primary flex w-full max-w-md flex-col gap-4">
        {% csrf_token %}
        <h1 class="text-2xl font-bold text-txt-primary">
            {% if tag %}Edit tag{% else %}New tag{% endif %}
        </h1>

        <div>
            <label class="mb-1 block text-txt-primary" for="{{ form.name.id_for_label }}">{{ form.name.label }}</label>
            {{ form.name }}
            {% for error in form.name.errors %}
                <p class="text-sm text-danger">{{ error }}</p>
            {% endfor %}
        </div>

        <div class="flex justify-end gap-3">
            <a href="{% url 'decks:tags_page' %}" class="rounded-md border border-border px-4 py-2 text-sm text-txt-primary hover:bg-hover">Cancel</a>
            <button type="submit" class="btn-primary">Save</button>
        </div>
    </form>
</div>
{% endblock %}
