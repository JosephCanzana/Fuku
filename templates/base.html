<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    {% load static %}
    <link href="{% static 'css/output.css' %}" rel="stylesheet">
    <title>{% block title %}Fuku{% endblock %}</title>
    
    <script>
        // get the theme every reload
        (function () {
            try {
                var t = localStorage.getItem("theme");
                if (["gray", "light", "dark"].includes(t)) {
                    document.documentElement.dataset.theme = t;
                }
            } catch (e) {}
        })();
    </script>
</head>
<body class="bg-main h-screen w-screen font-main">
    {% block base %}
    {% endblock %}
        <script>
        // Modal
        const modal = document.getElementById("app-modal");
        if (modal) {
            const message = document.getElementById("modal-message");
            const confirmBtn = document.getElementById("modal-confirm");
            const cancelBtn = document.getElementById("modal-cancel");
            let pendingForm = null;

            function openModal(text, confirmText, type) {
                message.textContent = text;
                confirmBtn.textContent = confirmText;
                modal.dataset.type = type;
                modal.showModal();
            }

            document.querySelectorAll("[data-modal-open]").forEach(function (button) {
                button.addEventListener("click", function () {
                    pendingForm = button.closest("form");
                    openModal(
                        button.dataset.modalMessage || "Are you sure?",
                        button.dataset.modalConfirm || "Confirm",
                        button.dataset.modalType || "neutral"
                    );
                });
            });

            cancelBtn.addEventListener("click", function () { modal.close(); });

            confirmBtn.addEventListener("click", function () {
                if (pendingForm) pendingForm.requestSubmit();
                modal.close();
            });
        }
    </script>

    <script>
        // Show/hide password
        document.addEventListener("click", (e) => {
            const btn = e.target.closest("[data-toggle-password]");
            if (!btn) return;

            const input = document.getElementById(btn.dataset.togglePassword);
            if (!input) return;

            const show = input.type === "password";
            input.type = show ? "text" : "password";
            btn.textContent = show ? "Hide" : "Show";
            btn.setAttribute("aria-pressed", show);
        });
    </script>

    
    <script>
        const THEMES = ["gray", "light", "dark"];

        function applyTheme(theme) {
            document.documentElement.dataset.theme = theme;
            document.querySelectorAll("[data-theme-icon]").forEach((icon) => {
                icon.classList.toggle("hidden", icon.dataset.themeIcon !== theme);
            });
            document.querySelectorAll("[data-theme-cycle]").forEach((btn) => {
                btn.setAttribute("aria-label", `Theme: ${theme}. Click to change.`);
            });
        }

        // Default theme at first usage
        applyTheme(document.documentElement.dataset.theme || "gray");

        // Cycle through every theme
        document.addEventListener("click", (e) => {
            const btn = e.target.closest("[data-theme-cycle]");
            if (!btn) return;

            const current = document.documentElement.dataset.theme || "gray";
            const next = THEMES[(THEMES.indexOf(current) + 1) % THEMES.length];
            applyTheme(next);
            try { localStorage.setItem("theme", next); } catch (err) {}
        });
    </script>
</body>
</html>
