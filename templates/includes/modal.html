<dialog id="app-modal" data-type="info" class="group m-auto w-full max-w-md rounded-lg border border-border bg-surface p-6 text-txt-primary shadow-lg backdrop:bg-black/60">
    <h3 id="modal-message" class="mb-6 text-center">Are you sure?</h3>
    <div class="flex justify-center gap-3">
        <button type="button" id="modal-confirm" 
        class="rounded-md bg-accent px-4 py-2 text-sm font-medium text-txt-on-accent hover:brightness-110 
        group-data-[type=danger]:bg-danger group-data-[type=warning]:bg-warning group-data-[type=success]:bg-success group-data-[type=neutral]:bg-accent">
            Confirm
        </button>
        <button type="button" id="modal-cancel" class="rounded-md border border-border px-4 py-2 text-sm text-txt-primary hover:bg-hover">
            Cancel
        </button>
    </div>
</dialog>
